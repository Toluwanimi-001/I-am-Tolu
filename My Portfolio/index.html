<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tolu — 3D Creator</title>

  <!-- Favicon (multiple sizes for crisp display) -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            kanit: ['Kanit', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html,
    body,
    #root {
      background: #0c0c0c;
      font-family: 'Kanit', sans-serif;
      overflow-x: clip;
      scroll-behavior: smooth;
    }
    .hero-heading {
      background: linear-gradient(180deg, #646973 0%, #bbccd7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .main-wrapper {
      overflow-x: clip;
    }
    .contact-btn-gradient {
      background: linear-gradient(123deg, #18011f 7%, #b600a8 37%, #7621b0 72%, #be4c00 100%);
      box-shadow: 0px 4px 4px rgba(181, 1, 167, 0.25), 4px 4px 12px #7721b1 inset;
      outline: 2px solid white;
      outline-offset: -3px;
    }
    .marquee-row {
      will-change: transform;
      display: flex;
      gap: 0.75rem;
      flex-shrink: 0;
    }
    .marquee-img {
      width: 420px;
      height: 270px;
      border-radius: 1rem;
      object-fit: cover;
      flex-shrink: 0;
    }
    @media (max-width: 640px) {
      .marquee-img {
        width: 280px;
        height: 180px;
        border-radius: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Import map -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.3.1",
        "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
        "framer-motion": "https://esm.sh/framer-motion@11.0.0",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0"
      }
    }
  </script>

  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-type="module">
    import React, { useState, useRef, useEffect, useCallback, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      motion,
      useScroll,
      useTransform,
      useMotionValue,
      useMotionTemplate,
    } from 'framer-motion';
    import { ArrowUpRight, ExternalLink } from 'lucide-react';

    // ────────────────────────────────────
    // 1. MAGNET
    // ────────────────────────────────────
    const Magnet = ({
      children,
      padding = 150,
      strength = 3,
      activeTransition = 'transform 0.3s ease-out',
      inactiveTransition = 'transform 0.6s ease-in-out',
      className = '',
    }) => {
      const ref = useRef(null);
      const x = useMotionValue(0);
      const y = useMotionValue(0);
      const [isActive, setIsActive] = useState(false);

      const handleMouseMove = useCallback(
        (e) => {
          if (!ref.current) return;
          const rect = ref.current.getBoundingClientRect();
          const centerX = rect.left + rect.width / 2;
          const centerY = rect.top + rect.height / 2;
          const distX = e.clientX - centerX;
          const distY = e.clientY - centerY;

          const expandedRect = {
            left: rect.left - padding,
            top: rect.top - padding,
            right: rect.right + padding,
            bottom: rect.bottom + padding,
          };
          const inside =
            e.clientX >= expandedRect.left &&
            e.clientX <= expandedRect.right &&
            e.clientY >= expandedRect.top &&
            e.clientY <= expandedRect.bottom;

          if (inside) {
            x.set(distX / strength);
            y.set(distY / strength);
            setIsActive(true);
          } else {
            x.set(0);
            y.set(0);
            setIsActive(false);
          }
        },
        [padding, strength, x, y]
      );

      useEffect(() => {
        window.addEventListener('mousemove', handleMouseMove, { passive: true });
        return () => window.removeEventListener('mousemove', handleMouseMove);
      }, [handleMouseMove]);

      const transform = useMotionTemplate`translate3d(${x}px, ${y}px, 0)`;

      return (
        <div
          ref={ref}
          className={`magnet-wrap ${className}`}
          style={{
            transform,
            transition: isActive ? activeTransition : inactiveTransition,
          }}
        >
          {children}
        </div>
      );
    };

    // ────────────────────────────────────
    // 2. FADE IN ON SCROLL
    // ────────────────────────────────────
    const FadeIn = ({
      children,
      delay = 0,
      duration = 0.7,
      x = 0,
      y = 30,
      className = '',
      as: Tag = 'div',
    }) => {
      const MotionTag = motion[Tag] || motion.div;
      return (
        <MotionTag
          className={className}
          initial={{ opacity: 0, x, y }}
          whileInView={{ opacity: 1, x: 0, y: 0 }}
          viewport={{ once: true, margin: '50px', amount: 0 }}
          transition={{ delay, duration, ease: [0.25, 0.1, 0.25, 1] }}
        >
          {children}
        </MotionTag>
      );
    };

    // ────────────────────────────────────
    // 3. BUTTONS
    // ────────────────────────────────────
    const ContactButton = ({ className = '' }) => (
      <motion.a
        href="mailto:toluwanimiakinyemi2@gmail.com?subject=Let's%20work%20together"
        whileHover={{ scale: 1.04 }}
        whileTap={{ scale: 0.96 }}
        className={`contact-btn-gradient rounded-full text-white font-medium uppercase tracking-widest
          px-8 py-3 sm:px-10 sm:py-3.5 md:px-12 md:py-4 text-xs sm:text-sm md:text-base
          flex items-center gap-2 transition-opacity duration-200 hover:opacity-90 ${className}`}
      >
        Contact Me <ArrowUpRight className="w-4 h-4" />
      </motion.a>
    );

    const LiveProjectButton = ({ href, className = '' }) => (
      <motion.a
        href={href}
        target="_blank"
        rel="noopener noreferrer"
        whileHover={{ scale: 1.04, backgroundColor: 'rgba(215,226,234,0.1)' }}
        whileTap={{ scale: 0.96 }}
        className={`rounded-full border-2 border-[#D7E2EA] text-[#D7E2EA] font-medium uppercase tracking-widest
          px-8 py-3 sm:px-10 sm:py-3.5 text-sm sm:text-base flex items-center gap-2 transition-colors duration-200 ${className}`}
      >
        Live Project <ExternalLink className="w-4 h-4" />
      </motion.a>
    );

    // ────────────────────────────────────
    // 4. ANIMATED TEXT
    // ────────────────────────────────────
    const AnimatedText = ({ text, className = '' }) => {
      const ref = useRef(null);
      const { scrollYProgress } = useScroll({
        target: ref,
        offset: ['start 0.8', 'end 0.2'],
      });
      const chars = useMemo(() => text.split(''), [text]);

      return (
        <p
          ref={ref}
          className={`${className} relative`}
          style={{ color: 'rgba(215,226,234,0.2)', wordBreak: 'break-word' }}
        >
          {chars.map((char, i) => {
            const charStart = i / chars.length;
            const charEnd = (i + 1) / chars.length;
            const opacity = useTransform(scrollYProgress, [charStart, charEnd], [0, 1]);
            return (
              <span key={i} style={{ color: '#D7E2EA', opacity }}>
                {char === ' ' ? '\u00A0' : char}
              </span>
            );
          })}
        </p>
      );
    };

    // ────────────────────────────────────
    // 5. MARQUEE
    // ────────────────────────────────────
    const row1 = [
      'https://motionsites.ai/assets/hero-space-voyage-preview-eECLH3Yc.gif',
      'https://motionsites.ai/assets/hero-codenest-preview-Cgppc2qV.gif',
      'https://motionsites.ai/assets/hero-vex-ventures-preview-BczMFIiw.gif',
      'https://motionsites.ai/assets/hero-stellar-ai-v2-preview-DjvxjG3C.gif',
      'https://motionsites.ai/assets/hero-asme-preview-B_nGDnTP.gif',
      'https://motionsites.ai/assets/hero-transform-data-preview-Cx5OU29N.gif',
      'https://motionsites.ai/assets/hero-vitara-preview-Cjz2QYyU.gif',
      'https://motionsites.ai/assets/hero-terra-preview-BFjrCr7T.gif',
      'https://motionsites.ai/assets/hero-skyelite-preview-DHaZIgUv.gif',
      'https://motionsites.ai/assets/hero-aethera-preview-DknSlcTa.gif',
      'https://motionsites.ai/assets/hero-designpro-preview-D8c5_een.gif',
    ];
    const row2 = [
      'https://motionsites.ai/assets/hero-stellar-ai-preview-D3HL6bw1.gif',
      'https://motionsites.ai/assets/hero-xportfolio-preview-D4A8maiC.gif',
      'https://motionsites.ai/assets/hero-orbit-web3-preview-BXt4OttD.gif',
      'https://motionsites.ai/assets/hero-nexora-preview-cx5HmUgo.gif',
      'https://motionsites.ai/assets/hero-evr-ventures-preview-DZxeVFEX.gif',
      'https://motionsites.ai/assets/hero-planet-orbit-preview-DWAP8Z1P.gif',
      'https://motionsites.ai/assets/hero-new-era-preview-CocuDUm9.gif',
      'https://motionsites.ai/assets/hero-wealth-preview-B70idl_u.gif',
      'https://motionsites.ai/assets/hero-luminex-preview-CxOP7ce6.gif',
      'https://motionsites.ai/assets/hero-celestia-preview-0yO3jXO8.gif',
    ];

    const MarqueeSection = () => {
      const sectionRef = useRef(null);
      const [offset, setOffset] = useState(0);

      useEffect(() => {
        const handleScroll = () => {
          if (!sectionRef.current) return;
          const sectionTop = sectionRef.current.getBoundingClientRect().top + window.scrollY;
          const val = (window.scrollY - sectionTop + window.innerHeight) * 0.3;
          setOffset(Math.max(0, val));
        };
        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const tripledRow1 = useMemo(() => [...row1, ...row1, ...row1], []);
      const tripledRow2 = useMemo(() => [...row2, ...row2, ...row2], []);

      return (
        <section ref={sectionRef} className="bg-[#0C0C0C] pt-24 sm:pt-32 md:pt-40 pb-10 overflow-hidden">
          <div className="flex flex-col gap-3">
            <div className="marquee-row" style={{ transform: `translateX(${offset - 200}px)` }}>
              {tripledRow1.map((src, i) => (
                <img key={`r1-${i}`} src={src} alt="" loading="lazy" className="marquee-img" />
              ))}
            </div>
            <div className="marquee-row" style={{ transform: `translateX(${-(offset - 200)}px)` }}>
              {tripledRow2.map((src, i) => (
                <img key={`r2-${i}`} src={src} alt="" loading="lazy" className="marquee-img" />
              ))}
            </div>
          </div>
        </section>
      );
    };

    // ────────────────────────────────────
    // 6. ABOUT
    // ────────────────────────────────────
    const AboutSection = () => {
      const text = `I work across web development, photography, videography, and digital media. I like creating things that look good, work properly, and have a reason to exist. From websites and digital platforms to photos, videos, and content, I’m usually somewhere in the middle of making something.`;

      return (
        <section id="about" className="min-h-screen flex flex-col items-center justify-center px-5 sm:px-8 md:px-10 py-20 relative">
          <div className="absolute inset-0 pointer-events-none overflow-hidden">
            <FadeIn delay={0.1} x={-80} y={0} duration={0.9} className="absolute top-[4%] left-[1%] sm:left-[2%] md:left-[4%]">
              <img src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/moon_icon.11395d36.png" alt="" className="w-[120px] sm:w-[160px] md:w-[210px] opacity-70" loading="lazy" />
            </FadeIn>
            <FadeIn delay={0.25} x={-80} y={0} duration={0.9} className="absolute bottom-[8%] left-[3%] sm:left-[6%] md:left-[10%]">
              <img src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/p59_1.4659672e.png" alt="" className="w-[100px] sm:w-[140px] md:w-[180px] opacity-70" loading="lazy" />
            </FadeIn>
            <FadeIn delay={0.15} x={80} y={0} duration={0.9} className="absolute top-[4%] right-[1%] sm:right-[2%] md:right-[4%]">
              <img src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/lego_icon-1.703bb594.png" alt="" className="w-[120px] sm:w-[160px] md:w-[210px] opacity-70" loading="lazy" />
            </FadeIn>
            <FadeIn delay={0.3} x={80} y={0} duration={0.9} className="absolute bottom-[8%] right-[3%] sm:right-[6%] md:right-[10%]">
              <img src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/Group_134-1.2e04f3ce.png" alt="" className="w-[130px] sm:w-[170px] md:w-[220px] opacity-70" loading="lazy" />
            </FadeIn>
          </div>

          <div className="relative z-10 flex flex-col items-center gap-10 sm:gap-14 md:gap-16 w-full">
            <FadeIn delay={0} y={40}>
              <h2 className="hero-heading font-black uppercase leading-none tracking-tight text-center" style={{ fontSize: 'clamp(3rem, 12vw, 160px)' }}>
                About me
              </h2>
            </FadeIn>

            <AnimatedText
              text={text}
              className="font-medium text-center leading-relaxed max-w-[560px] w-full"
              style={{ fontSize: 'clamp(1rem, 2vw, 1.35rem)' }}
            />

            <div className="gap-16 sm:gap-20 md:gap-24 flex flex-col items-center">
              <ContactButton />
            </div>
          </div>
        </section>
      );
    };

    // ────────────────────────────────────
    // 7. SERVICES
    // ────────────────────────────────────
    const services = [
      { num: '01', name: 'Web Development', desc: 'Building responsive websites and digital experiences that are clean, functional, and made to feel good on the screen.' },
      { num: '02', name: 'Photography', desc: 'Portraits, events, lifestyle and everything in between — finding good frames and making ordinary moments worth looking at twice.' },
      { num: '03', name: 'Videography', desc: 'Shooting and creating visual content that moves, tells a story, and keeps people watching.' },
      { num: '04', name: 'Digital Media', desc: 'Creating content, managing digital platforms, and helping brands show up online in a way that actually feels like them.' },
      { num: '05', name: 'Creative Direction', desc: 'Taking an idea from “I have something in mind” to something people can actually see, interact with, and remember.' },
    ];

    const ServicesSection = () => (
      <section id="services" className="bg-white rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] px-5 sm:px-8 md:px-10 py-20 sm:py-24 md:py-32">
        <h2 className="text-[#0C0C0C] font-black uppercase text-center mb-16 sm:mb-20 md:mb-28" style={{ fontSize: 'clamp(3rem, 12vw, 160px)' }}>
          Services
        </h2>
        <div className="max-w-5xl mx-auto flex flex-col">
          {services.map((s, i) => (
            <FadeIn key={s.num} delay={i * 0.1} y={30} className={`flex flex-col sm:flex-row gap-4 sm:gap-8 md:gap-12 py-8 sm:py-10 md:py-12 ${i < services.length - 1 ? 'border-b border-[rgba(12,12,12,0.15)]' : ''}`}>
              <span className="text-[#0C0C0C] font-black leading-none" style={{ fontSize: 'clamp(3rem, 10vw, 140px)', flexShrink: 0 }}>{s.num}</span>
              <div className="flex flex-col gap-1 sm:gap-2">
                <h3 className="font-medium uppercase text-[#0C0C0C]" style={{ fontSize: 'clamp(1rem, 2.2vw, 2.1rem)' }}>{s.name}</h3>
                <p className="font-light leading-relaxed max-w-2xl text-[#0C0C0C] opacity-60" style={{ fontSize: 'clamp(0.85rem, 1.6vw, 1.25rem)' }}>{s.desc}</p>
              </div>
            </FadeIn>
          ))}
        </div>
      </section>
    );

    // ────────────────────────────────────
    // 8. PROJECTS
    // ────────────────────────────────────
    const projectData = [
      {
        num: '01',
        name: 'Velvet Concierge',
        category: 'Client',
        liveUrl: 'https://conciergebyvelvet.com',
        col1img1: 'velvet-concierge-1.webp',
        col1img2: 'velvet-concierge-2.webp',
        col2img: 'velvet-concierge-3.webp',
      },
      {
        num: '02',
        name: 'TydaConnect',
        category: 'Client',
        liveUrl: 'https://tydaconnect.com',
        col1img1: 'tydaconnect-1.webp',
        col1img2: 'tydaconnect-2.webp',
        col2img: 'tydaconnect-3.webp',
      },
      {
        num: '03',
        name: 'Through My Lens',
        category: 'Personal',
        liveUrl: 'https://wa.me/2349060335653?text=Hi%20Tolu%2C%20I%20am%20interested%20in%20seeing%20your%20photo%20projects',
        col1img1: 'throughmylens-1.webp',
        col1img2: 'throughmylens-2.webp',
        col2img: 'throughmylens-3.webp',
      },
    ];

    const ProjectCard = ({ project, index, totalCards }) => {
      const targetScale = 1 - (totalCards - 1 - index) * 0.03;
      const ref = useRef(null);
      const { scrollYProgress } = useScroll({ target: ref, offset: ['start end', 'end start'] });
      const scale = useTransform(scrollYProgress, [0, 0.5, 1], [targetScale, targetScale, targetScale]);
      const opacity = useTransform(scrollYProgress, [0, 0.3, 0.7, 1], [0.85, 1, 1, 0.85]);

      return (
        <div ref={ref} className="sticky h-[85vh] flex items-center justify-center" style={{ top: `${index * 28}px`, zIndex: 10 + index }}>
          <motion.div style={{ scale, opacity }} className="w-full max-w-5xl rounded-[40px] sm:rounded-[50px] md:rounded-[60px] border-2 border-[#D7E2EA] bg-[#0C0C0C] p-4 sm:p-6 md:p-8">
            <div className="flex flex-wrap items-end justify-between gap-4 mb-4 sm:mb-6">
              <div className="flex items-end gap-3 sm:gap-5">
                <span className="text-[#D7E2EA] font-black leading-none" style={{ fontSize: 'clamp(2.5rem, 8vw, 120px)' }}>{project.num}</span>
                <div className="flex flex-col pb-1 sm:pb-2">
                  <span className="text-[#D7E2EA] text-xs sm:text-sm uppercase tracking-widest opacity-60 font-light">{project.category}</span>
                  <h3 className="text-[#D7E2EA] font-medium uppercase text-lg sm:text-xl md:text-2xl tracking-wide">{project.name}</h3>
                </div>
              </div>
              <LiveProjectButton href={project.liveUrl} />
            </div>
            <div className="flex gap-3 sm:gap-4">
              <div className="w-[40%] flex flex-col gap-3 sm:gap-4">
                <img src={project.col1img1} alt="" loading="lazy" className="w-full rounded-[40px] sm:rounded-[50px] md:rounded-[60px] object-cover" style={{ height: 'clamp(130px, 16vw, 230px)' }} />
                <img src={project.col1img2} alt="" loading="lazy" className="w-full rounded-[40px] sm:rounded-[50px] md:rounded-[60px] object-cover" style={{ height: 'clamp(160px, 22vw, 340px)' }} />
              </div>
              <div className="w-[60%]">
                <img src={project.col2img} alt="" loading="lazy" className="w-full h-full rounded-[40px] sm:rounded-[50px] md:rounded-[60px] object-cover" style={{ minHeight: 'clamp(300px, 38vw, 580px)' }} />
              </div>
            </div>
          </motion.div>
        </div>
      );
    };

    const ProjectsSection = () => (
      <section id="projects" className="bg-[#0C0C0C] rounded-t-[40px] sm:rounded-t-[50px] md:rounded-t-[60px] -mt-10 sm:-mt-12 md:-mt-14 relative z-10 py-16 sm:py-20 md:py-28">
        <h2 className="hero-heading font-black uppercase leading-none tracking-tight text-center mb-10 sm:mb-14 md:mb-20" style={{ fontSize: 'clamp(3rem, 12vw, 160px)' }}>
          Project
        </h2>
        <div className="relative">
          {projectData.map((p, i) => (
            <ProjectCard key={p.num} project={p} index={i} totalCards={projectData.length} />
          ))}
        </div>
      </section>
    );

    // ────────────────────────────────────
    // 9. CONTACT SECTION
    // ────────────────────────────────────
    const ContactSection = () => (
      <section id="contact" className="bg-[#0C0C0C] py-20 sm:py-28 flex flex-col items-center justify-center gap-8 px-5">
        <h2 className="hero-heading font-black uppercase text-5xl sm:text-6xl md:text-7xl">Get in touch</h2>
        <p className="text-[#D7E2EA] font-light text-center max-w-xl" style={{ fontSize: 'clamp(0.9rem, 1.4vw, 1.2rem)' }}>
          Got a website to build, something worth shooting, or an idea you want to make real? Let's talk.
        </p>
        <ContactButton />
      </section>
    );

    // ────────────────────────────────────
    // 10. HERO (mobile layout fixed)
    // ────────────────────────────────────
    const HeroSection = () => (
      <section className="h-[75vh] sm:h-screen flex flex-col overflow-x-clip relative">
        {/* Navbar */}
        <FadeIn delay={0} y={-20} as="nav" className="flex justify-between items-center px-6 md:px-10 pt-5 sm:pt-6 md:pt-8 z-20 relative">
          {[
            { label: 'About', href: '#about' },
            { label: 'Services', href: '#services' },
            { label: 'Projects', href: '#projects' },
            { label: 'Contact', href: '#contact' },
          ].map((item) => (
            <a
              key={item.label}
              href={item.href}
              className="text-[#D7E2EA] font-medium uppercase tracking-wider text-xs sm:text-sm md:text-lg lg:text-[1.4rem] hover:opacity-70 transition-opacity duration-200 cursor-pointer"
            >
              {item.label}
            </a>
          ))}
        </FadeIn>

        {/* Main content – flex column for mobile, centered */}
        <div className="flex-1 flex flex-col items-center justify-center sm:hidden">
          {/* Heading with extra top spacing */}

                className="w-[180px] object-contain"

        {/* Desktop layout (hidden on mobile) */}

          <div className="overflow-hidden z-10 relative mt-0 sm:mt-4 md:-mt-5">
            <FadeIn delay={0.15} y={40}>
              <h1 className="hero-heading font-black uppercase tracking-tight leading-none whitespace-nowrap w-full text-[15vw] md:text-[16vw] lg:text-[17.5vw]">
                Hi, i&apos;m Tolu
              </h1>
            </FadeIn>
          </div>
          <FadeIn delay={0.6} y={30} className="absolute left-1/2 -translate-x-1/2 z-10 top-auto bottom-0 pointer-events-none">
            <Magnet padding={150} strength={3} activeTransition="transform 0.3s ease-out" inactiveTransition="transform 0.6s ease-in-out">
              <img
                src="Tolu.png"
                alt="Tolu portrait"
                className="w-[360px] md:w-[440px] lg:w-[520px] object-contain"
                loading="eager"
              />
            </Magnet>
          </FadeIn>
        </div>

        {/* Bottom bar */}
        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-end pb-6 sm:pb-8 md:pb-10 px-6 md:px-10 z-20 gap-3 sm:gap-0">
          <FadeIn delay={0.35} y={20} className="w-full sm:max-w-[220px] md:max-w-[260px]">
            <p className="text-[#D7E2EA] font-light uppercase tracking-wide leading-snug" style={{ fontSize: 'clamp(0.65rem, 1.2vw, 1.5rem)' }}>
              a creative developer who builds for the web, shoots what catches my eye, and turns ideas into things people can actually experience
            </p>
          </FadeIn>
          <FadeIn delay={0.5} y={20} className="self-end sm:self-auto">
            <ContactButton />
          </FadeIn>
        </div>
      </section>
    );

    // ────────────────────────────────────
    // 11. APP
    // ────────────────────────────────────
    const App = () => (
      <div className="main-wrapper">
        <HeroSection />
        <MarqueeSection />
        <AboutSection />
        <ServicesSection />
        <ProjectsSection />
        <ContactSection />
      </div>
    );

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Source protection script (deterrent) -->
  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function(e) {
      if (e.keyCode == 123 || // F12
          (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74)) || // Ctrl+Shift+I/J
          (e.ctrlKey && e.keyCode == 85) || // Ctrl+U
          (e.ctrlKey && e.keyCode == 83)) { // Ctrl+S
        return false;
      }
    };
  </script>
